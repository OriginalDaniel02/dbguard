name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - name: Cross-compile
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/dbguard_${os}_${arch}${ext}" ./cmd/dbguard
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Smoke test the release binary
        run: |
          out=$(./dist/dbguard_linux_amd64 version)
          echo "$out"
          [ "$out" = "dbguard ${GITHUB_REF_NAME}" ] || { echo "version stamp does not match the tag"; exit 1; }
          ./dist/dbguard_linux_amd64 check --rows transactions=14000000 testdata/migrations/V2__risky.sql | tee /dev/stderr | grep -q "create-index"
          ./dist/dbguard_linux_amd64 check --engine mysql --rows orders=14000000 testdata/liquibase/mysql-changelog.xml | grep -q "add-foreign-key"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Package the VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm run package
          # the extension is covered by the same checksums.txt as the binaries
          sha256sum *.vsix >> ../dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            vscode/*.vsix
