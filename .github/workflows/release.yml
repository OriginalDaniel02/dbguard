name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - name: Cross-compile
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/dbguard_${os}_${arch}${ext}" ./cmd/dbguard
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Smoke test the release binary
        run: |
          out=$(./dist/dbguard_linux_amd64 version)
          echo "$out"
          [ "$out" = "dbguard ${GITHUB_REF_NAME}" ] || { echo "version stamp does not match the tag"; exit 1; }
          ./dist/dbguard_linux_amd64 check --rows transactions=14000000 testdata/migrations/V2__risky.sql | tee /dev/stderr | grep -q "create-index"
          ./dist/dbguard_linux_amd64 check --engine mysql --rows orders=14000000 testdata/liquibase/mysql-changelog.xml | grep -q "add-foreign-key"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test the Docker image (amd64)
        run: |
          docker buildx build --platform linux/amd64 --load -t dbguard:test .
          out=$(docker run --rm dbguard:test version)
          echo "$out"
          [ "$out" = "dbguard ${GITHUB_REF_NAME}" ] || { echo "image version does not match the tag"; exit 1; }
          docker run --rm -v "$PWD/testdata:/t:ro" dbguard:test check --rows transactions=14000000 /t/migrations/V2__risky.sql | grep -q create-index
      - name: Publish the Docker image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/originaldaniel02/dbguard:${{ github.ref_name }}
            ghcr.io/originaldaniel02/dbguard:latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Package the VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm run package
          # the extension is covered by the same checksums.txt as the binaries
          sha256sum *.vsix >> ../dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            vscode/*.vsix
      # Lets workflows that pin the major version (@v0) follow the latest release.
      - name: Move the major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -fa "$major" -m "Moves to $GITHUB_REF_NAME" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  publish-packages:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.pub.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish to the Homebrew tap and the Scoop bucket
        id: pub
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PACKAGING_TOKEN is not set, so Homebrew and Scoop were not updated. Run scripts/publish-taps.sh by hand."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/publish-taps.sh "$GITHUB_REF_NAME"
          echo "published=true" >> "$GITHUB_OUTPUT"

  verify-packages:
    needs: [release, publish-packages]
    uses: ./.github/workflows/verify-packages.yml
    with:
      tag: ${{ github.ref_name }}
      taps: ${{ needs.publish-packages.outputs.published == 'true' }}

