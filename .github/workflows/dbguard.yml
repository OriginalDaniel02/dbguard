name: DB Guard
on:
  # No `paths:` filter on purpose: the action only checks changed migration files and is a
  # no-op otherwise. A path filter would skip the run entirely, which leaves a stale comment
  # behind when a risky migration is removed and blocks PRs when this check is "required".
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          version: v0.2.0
          engine: mysql
          dsn: ${{ secrets.DBGUARD_READONLY_DSN }}
          migrations-path: db/migration
