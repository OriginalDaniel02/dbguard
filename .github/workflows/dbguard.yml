name: DB Guard
on:
  pull_request:
    paths: ["db/migration/**.sql"]
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          version: v0.1.0
          dsn: ${{ secrets.DBGUARD_READONLY_DSN }}
          migrations-path: db/migration
