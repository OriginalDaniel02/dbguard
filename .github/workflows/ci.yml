name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: shop
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -psecret --silent" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DBGUARD_TEST_DSN: postgres://postgres:secret@localhost:5432/postgres?sslmode=disable
      DBGUARD_TEST_MYSQL_DSN: mysql://root:secret@localhost:3306/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Static build (no cgo)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/dbguard

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Build dbguard
        run: go build -o "$RUNNER_TEMP/dbguard" ./cmd/dbguard
      - name: Install and compile
        working-directory: vscode
        run: |
          npm ci
          npm run compile
      - name: Unit tests and tests against the real dbguard binary
        working-directory: vscode
        env:
          DBGUARD_BIN: ${{ runner.temp }}/dbguard
        run: node --test out/test/core.test.js out/test/cli.test.js
      - name: Tests inside a real VS Code
        working-directory: vscode
        env:
          DBGUARD_BIN: ${{ runner.temp }}/dbguard
        run: xvfb-run -a node out/test/vscode/runTest.js
      - name: Package the extension
        working-directory: vscode
        run: npm run package
