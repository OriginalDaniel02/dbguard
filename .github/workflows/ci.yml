name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: shop
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -psecret --silent" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DBGUARD_TEST_DSN: postgres://postgres:secret@localhost:5432/postgres?sslmode=disable
      DBGUARD_TEST_MYSQL_DSN: mysql://root:secret@localhost:3306/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Static build (no cgo)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/dbguard
